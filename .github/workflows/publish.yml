name: Publish

# On merge: give every new release an immutable artifact on this repository, then rebuild and
# deploy the index clients download.
#
# Everything here runs with this repository's own GITHUB_TOKEN. That is deliberate: because packing
# is deterministic, CI can rebuild a source-hosted package's artifact from the merged tree instead
# of accepting one built elsewhere, so no cross-repository credential exists anywhere in the flow.
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      index-only:
        description: 'Rebuild and deploy the index without publishing any release'
        type: boolean
        default: false

# contents: write is for creating releases, not for pushing commits — nothing here writes to the
# branch. A manifest names this registry's own artifact URL when it is written, because the release
# tag and asset name are fully determined, so nothing has to come back afterwards and edit one in.
# That is what lets a published manifest be genuinely immutable and the branch require pull requests
# with no exception for CI.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Releases and the index must not be written by two runs at once.
  group: publish
  cancel-in-progress: false

env:
  KPM_REPOSITORY: keysharp-org/KPM

jobs:
  release:
    name: Release new artifacts
    # Skippable so the index can be redeployed on its own — after a metadata-only change such as a
    # yank or a corrected description, and to verify Pages before committing to a large publish.
    if: ${{ inputs.index-only != true }}
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build kpm
        run: |
          git clone --depth 1 https://github.com/${KPM_REPOSITORY}.git "$RUNNER_TEMP/kpm"
          dotnet publish "$RUNNER_TEMP/kpm/src/KPM.Cli/KPM.Cli.csproj" -c Release -o "$RUNNER_TEMP/kpm-bin"
          echo "$RUNNER_TEMP/kpm-bin" >> "$GITHUB_PATH"

      - name: Create releases for anything unpublished
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-releases.sh

  index:
    name: Build and deploy the index
    needs: release
    # Runs even when nothing was released: the index reflects the whole registry, so a metadata-only
    # change still has to reach clients. Only an actual release failure should stop it, since the
    # index would then name artifacts that were not published.
    if: ${{ always() && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The release job may have pushed the recorded URLs; publish the index built from those.
          ref: main

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build kpm
        run: |
          git clone --depth 1 https://github.com/${KPM_REPOSITORY}.git "$RUNNER_TEMP/kpm"
          dotnet publish "$RUNNER_TEMP/kpm/src/KPM.Cli/KPM.Cli.csproj" -c Release -o "$RUNNER_TEMP/kpm-bin"
          echo "$RUNNER_TEMP/kpm-bin" >> "$GITHUB_PATH"

      - name: Build index.json.gz and catalog.json
        run: |
          kpm index . --out dist
          cp -r schemas dist/schemas
          # The custom domain is what makes this registry movable off GitHub later; without it,
          # every published lockfile would pin github.io URLs.
          if [ -f CNAME ]; then cp CNAME dist/CNAME; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
