name: Ingest

# Tracks the upstream ecosystem and proposes what changed as a pull request.
#
# Never publishes on its own: a forum edit that fixes a typo in a comment would otherwise become a
# release. A human reads the diff and merges, which is the same gate every other contribution passes.
on:
  schedule:
    - cron: '0 4 * * 1'   # Mondays, early UTC
  workflow_dispatch:
    inputs:
      max-versions:
        description: 'Upstream-tagged releases to keep per package (synthesized 0.x keeps only the newest)'
        default: '5'
      only:
        description: 'Import only entries whose key contains this'
        required: false

# Only contents:write, for creating releases and pushing the branch. Opening the pull request is
# left to a human, so no pull-requests permission is needed.
permissions:
  contents: write

env:
  KPM_REPOSITORY: keysharp-org/KPM
  KPM_VERSION: v0.1.0

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # kpm-bot is maintenance tooling and is not a released artifact, so this builds it — but from
      # the tag the registry is pinned to, not from whatever is currently on main. Same reason the
      # other workflows use a release: what the registry runs should be a stated version.
      - name: Build the bot
        run: |
          git clone --depth 1 --branch "${KPM_VERSION}" \
            "https://github.com/${KPM_REPOSITORY}.git" "$RUNNER_TEMP/kpm"
          dotnet publish "$RUNNER_TEMP/kpm/src/KPM.Bot/KPM.Bot.csproj" -c Release -o "$RUNNER_TEMP/bot"
          dotnet publish "$RUNNER_TEMP/kpm/src/KPM.Cli/KPM.Cli.csproj" -c Release -o "$RUNNER_TEMP/bot"
          echo "$RUNNER_TEMP/bot" >> "$GITHUB_PATH"

      - name: Import
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kpm-bot import-aris \
            --registry . \
            --artifacts "$RUNNER_TEMP/artifacts" \
            --max-versions "${{ inputs.max-versions || '5' }}" \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }} \
            | tee "$RUNNER_TEMP/import.log"

      - name: Validate what was imported
        run: kpm validate .

      # Artifacts must exist before the manifests that name them are merged: an imported package has
      # no source here to rebuild from, so nothing could reconstruct them later.
      - name: Publish artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: kpm-bot publish --registry . --artifacts "$RUNNER_TEMP/artifacts" --repository "$GITHUB_REPOSITORY"

      # Pushes a branch and stops, rather than opening the pull request itself. Opening one needs
      # "Actions can create pull requests", which is an organisation-wide switch granting every
      # workflow in every repository that ability — a lot of reach for the one job that wants it.
      # A branch needs only the contents:write this already has for creating releases, and the
      # review gate is unchanged: nothing reaches main except through a pull request.
      - name: Push the changes as a branch
        id: push
        run: |
          git config user.name  "kpm-bot"
          git config user.email "kpm-bot@users.noreply.github.com"
          # Staged first, then asked: a new package is entirely untracked, and `git diff` does not
          # see untracked files — so checking before staging would report "nothing to propose"
          # for exactly the case that matters most.
          git add packages

          if git diff --cached --quiet; then
            echo "Ingest found nothing to propose." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="ingest/$(date -u +%Y-%m-%d)"
          git checkout -b "$branch"
          # Message built in a file rather than inline: the import log is arbitrary upstream text
          # and has no business being parsed by the shell.
          { echo "Import upstream package updates"; echo; head -c 4000 "$RUNNER_TEMP/import.log"; } \
            > "$RUNNER_TEMP/message.txt"
          git commit -F "$RUNNER_TEMP/message.txt"
          git push --force-with-lease origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Say what to review
        if: steps.push.outputs.changed == 'true'
        run: |
          {
            echo "## Ingest found changes"
            echo
            echo "Open the pull request: <https://github.com/$GITHUB_REPOSITORY/compare/${{ steps.push.outputs.branch }}?expand=1>"
            echo
            echo '```'
            head -c 4000 "$RUNNER_TEMP/import.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
