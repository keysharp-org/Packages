name: Ingest

# Tracks the upstream ecosystem and proposes what changed as a pull request.
#
# Never publishes on its own: a forum edit that fixes a typo in a comment would otherwise become a
# release. A human reads the diff and merges, which is the same gate every other contribution passes.
on:
  schedule:
    - cron: '0 4 * * 1'   # Mondays, early UTC
  workflow_dispatch:
    inputs:
      max-versions:
        description: 'Releases to keep per package'
        default: '5'
      only:
        description: 'Import only entries whose key contains this'
        required: false

permissions:
  contents: write
  pull-requests: write

env:
  KPM_REPOSITORY: keysharp-org/KPM

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the bot
        run: |
          git clone --depth 1 https://github.com/${KPM_REPOSITORY}.git "$RUNNER_TEMP/kpm"
          dotnet publish "$RUNNER_TEMP/kpm/src/KPM.Bot/KPM.Bot.csproj" -c Release -o "$RUNNER_TEMP/bot"
          dotnet publish "$RUNNER_TEMP/kpm/src/KPM.Cli/KPM.Cli.csproj" -c Release -o "$RUNNER_TEMP/bot"
          echo "$RUNNER_TEMP/bot" >> "$GITHUB_PATH"

      - name: Import
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kpm-bot import-aris \
            --registry . \
            --artifacts "$RUNNER_TEMP/artifacts" \
            --max-versions "${{ inputs.max-versions || '5' }}" \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }} \
            | tee "$RUNNER_TEMP/import.log"

      - name: Validate what was imported
        run: kpm validate .

      # Artifacts must exist before the manifests that name them are merged: an imported package has
      # no source here to rebuild from, so nothing could reconstruct them later.
      - name: Publish artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: kpm-bot publish --registry . --artifacts "$RUNNER_TEMP/artifacts" --repository "$GITHUB_REPOSITORY"

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ingest/upstream
          title: 'Ingest: upstream package updates'
          labels: bot
          commit-message: 'Import upstream package updates'
          body-path: ${{ runner.temp }}/import.log
          delete-branch: true
